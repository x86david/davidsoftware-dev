name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master # Change to master if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        # Change /my-angular-app/ to your real repository name: /davidsoftware-dev/
        run: npm run build -- --configuration production --base-href /davidsoftware-dev/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Targets the exact Angular compilation output folder
          path: 'dist/my-angular-app/browser/.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
